; MGS4.FusionFix on a tab of the MGS4 SSAA and Aspect Ratio Enabler tool.
; Ships in the Enabler's zip under MGS4\scripts; the tab appears only while MGS4.FusionFix.ini
; or MGS4.FusionFix.asi is there. Format: docs/mod-tabs.md.
;
; Its ini keeps everything under one [MAIN] header.

[Mod]
Name = FusionFix
Ini = MGS4.FusionFix.ini
Asi = MGS4.FusionFix.asi
Blurb = MGS4.FusionFix replaces the game's shadow shaders and offers a few overrides. It has no settings tool of its own, so its settings are here; only the values below are written.\nIts shadow and dynamic-resolution overrides do the same job as Shadow Resolution Scale and Disable Dynamic Resolution on the Graphics tab (and as MGSPatriotFix's Custom Shadow Resolution): pick one owner for each and leave the others at their off values, or they will stack.

[MAIN/SkipIntro]
Label = Skip the intro
Type = bool
Default = true
BoolText = true|false
Feature = skip-intro
Help = Skips the start-up logos.

[MAIN/DynamicResolutionOverride]
Label = Disable dynamic resolution
Type = bool
Default = false
BoolText = 1.0|0
Feature = dynamic-resolution
Help = Holds the render resolution at full size instead of letting the game lower it under load, which is what makes the picture go soft. Written as 1.0 (on) or 0 (the game's own behaviour), as FusionFix expects.\nThe same thing as Disable Dynamic Resolution on the Graphics tab; use one or the other.

[MAIN/ShadowTexelOverride]
Label = Shadow texel size
Type = choice
Choices = 0|0.00390625|0.001953125|0.0009765625|0.00048828125
Default = 0
Feature = shadow-filter
Off = 0
Help = The shadow filter's texel step, as a fraction of the shadow map: 0 leaves the game's value; the others are 1/256, 1/512, 1/1024 and 1/2048. Match it to the shadow resolution below (1/4096 of the map for 4096, say, is 0.000244140625, which is not in this list - type it into the file by hand if you need it).

[MAIN/ShadowResolutionOverride]
Label = Shadow resolution
Type = int
Default = 0
Min = 0
Max = 8192
Feature = shadow-resolution
Off = 0
Help = Forces every shadow map to this size, up to 8192. 0 leaves the game's own mix.\nThe same thing as Shadow Resolution Scale on the Graphics tab and MGSPatriotFix's Custom Shadow Resolution; use one of the three.
