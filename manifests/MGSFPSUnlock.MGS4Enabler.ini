; MGSFPSUnlock (cipherxof) on a tab of the MGS4 SSAA and Aspect Ratio Enabler tool.
; Ships in the Enabler's zip under MGS4\scripts, where MGSFPSUnlock's own files go; the tab
; appears only while MGSFPSUnlock.ini or MGSFPSUnlock.asi is there. Format: docs/mod-tabs.md.

[Mod]
Name = MGSFPSUnlock
Ini = MGSFPSUnlock.ini
Asi = MGSFPSUnlock.asi
Url = https://github.com/cipherxof/MGSFPSUnlock
Blurb = MGSFPSUnlock (cipherxof) lets the game run above or below its 60 fps cap. It has no settings tool of its own, so its one setting is here. Only that value is written; the rest of its file is left alone.

[Settings/TargetFrameRate]
Label = Target frame rate
Type = int
Default = 60
Min = 15
Max = 1000
Feature = frame-rate
AlwaysOn = true
Help = The frame rate the game is unlocked to. 60 is the game's own limit; MGSFPSUnlock's default when its file is missing is 60 as well.\n\nAnything above 60 depends on the mod's patches, which its author describes as a work in progress, so the odd thing may misbehave at high rates. Your monitor's refresh rate is the usual choice.
