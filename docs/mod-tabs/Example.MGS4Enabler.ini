; A manifest for the MGS4 SSAA and Aspect Ratio Enabler tool: describes another mod's .ini so
; the tool can edit it on a tab of its own. Rename to <YourMod>.MGS4Enabler.ini and put it in
; the folder your .ini lives in. Format: docs/mod-tabs.md in the Enabler's repository.

[Mod]
Name = Example
Ini = Example.ini
Asi = Example.asi
Url = https://github.com/someone/Example
Blurb = Example (someone) does something to the game. It has no settings tool of its own, so its settings are here.\nOnly the values listed below are written; the rest of its file is left alone.

; One block per setting: [Section/Key] as written in Example.ini.

[Settings/TargetFrameRate]
Label = Target frame rate
Type = int
Default = 60
Min = 15
Max = 1000
Help = The frame rate the game runs at. 60 is the game's own limit.

[Graphics/Mode]
Label = Render mode
Type = choice
Choices = Fast|Balanced|Quality
Default = Balanced
Help = Fast trades quality for speed; Quality the other way round.

[Graphics/VSync]
Label = V-Sync
Type = bool
Default = true
BoolText = true|false
Help = Waits for the display before presenting a frame.
